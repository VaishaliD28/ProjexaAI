<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProjexaAI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <div class="login-container">
        <!-- Liquid Background Animations -->
        <div class="liquid-shape"></div>
        <div class="liquid-shape"></div>

        <div class="login-box glass-card">
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-brain fa-3x text-gradient"></i>
            </div>
            <h2 style="margin-bottom: 5px;">Welcome Back</h2>
            <p style="margin-bottom: 30px;">Access your ProjexaAI Dashboard</p>

            <form action="dashboard.html">
                <div style="position: relative;">
                    <i class="fa-solid fa-user"
                        style="position: absolute; left: 15px; top: 25px; color: var(--text-muted);"></i>
                    <input type="text" placeholder="Student ID / Email" class="login-input" style="padding-left: 45px;"
                        required>
                </div>

                <div style="position: relative;">
                    <i class="fa-solid fa-lock"
                        style="position: absolute; left: 15px; top: 25px; color: var(--text-muted);"></i>
                    <input type="password" placeholder="Password" class="login-input" style="padding-left: 45px;"
                        required>
                </div>

                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="#" style="font-size: 14px;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">
                    Login <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </form>

            <p style="margin-top: 20px; font-size: 14px;">
                New here? <a href="#">Create an account</a>
            </p>
        </div>
    </div>

    <!-- SCRIPT -->
    <script src="script.js"></script>
</body>

</html>
