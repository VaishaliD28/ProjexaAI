<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ProjexaAI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="animations.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-brain"></i>NEURAL NINJAS
        </div>

        <nav>
            <a href="#" class="nav-item">
                <i class="fas fa-grid-2"></i> Dashboard
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-book-open"></i> Academics
            </a>
            <a href="#" class="nav-item active">
                <i class="fas fa-user-shield"></i> Admin Panel
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-credit-card"></i> Fees & Finance
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="header">
            <div class="page-title">
                <h1>Administrator Panel</h1>
                <p>Manage Students, Faculty, and University Resources</p>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="refreshBtn"
                    style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
                    <i class="fas fa-sync-alt fa-lg"></i>
                </button>
                <div class="admin-badge">
                    <i class="fas fa-shield-alt"></i> Admin Access
                </div>
                <div
                    style="width:40px; height:40px; background:#334155; border-radius:50%; border:2px solid var(--primary);">
                </div>
            </div>
        </header>

        <!-- STATS ROW -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Students</div>
                <div class="stat-value" id="stat-students">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Faculty</div>
                <div class="stat-value" id="stat-faculty">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Pending Fees</div>
                <div class="stat-value" id="stat-fees">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Library Books</div>
                <div class="stat-value" id="stat-lib">--</div>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active">Students</button>
            <button class="tab-btn">Faculty</button>
            <button class="tab-btn">Academics</button>
            <button class="tab-btn">Fees</button>
        </div>

        <!-- STUDENT MODULE -->
        <div class="content-area animate-fadeIn">

            <!-- ADD STUDENT FORM -->
            <div style="margin-bottom: 40px;">
                <h3 style="margin-bottom: 20px; font-weight:600; display:flex; align-items:center; gap:10px;">
                    <span
                        style="width:4px; height:20px; background:var(--success); border-radius:2px; display:inline-block;"></span>
                    Onboard New Student
                </h3>

                <form id="studentForm">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Full Name *</label>
                            <input type="text" name="full_name" class="input-field" placeholder="e.g. Aarav Sharma"
                                required>
                        </div>
                        <div class="input-group">
                            <label>Roll Number *</label>
                            <input type="text" name="roll_no" class="input-field" placeholder="Unique ID" required>
                        </div>
                        <div class="input-group">
                            <label>Stream</label>
                            <select name="stream" class="input-field">
                                <option value="CSE">CSE</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Class</label>
                            <select name="current_class" class="input-field">
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year">2nd Year</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Section</label>
                            <select name="section" class="input-field">
                                <option value="A">A</option>
                                <option value="B">B</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" name="email" class="input-field" placeholder="student@university.edu">
                        </div>
                        <div class="input-group">
                            <label>Date of Birth</label>
                            <input type="date" name="dob" class="input-field">
                        </div>
                        <div class="input-group">
                            <label>Phone</label>
                            <input type="text" name="phone" class="input-field" placeholder="+91...">
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <button type="reset" class="btn"
                            style="background:transparent; color:var(--text-muted); margin-right:10px;">Reset</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Student Record
                        </button>
                    </div>
                </form>
            </div>

            <hr style="border:0; border-top:1px solid var(--glass-border); margin: 30px 0;">

            <!-- STUDENT LIST -->
            <div>
                <h3 style="margin-bottom: 20px; font-weight:600;">Student Directory</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Roll No</th>
                                <th>Name / Email</th>
                                <th>Stream</th>
                                <th>Class</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- SCRIPTS -->
    <script type="module" src="admin.js"></script>

</body>

</html>
