<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<img src="logo.png" class="logo">

<h2>University Portal Login</h2>

<input type="text" id="user" placeholder="Enter Name">
<input type="password" id="pass" placeholder="Enter Password">

<button onclick="login()">Login</button>
<button onclick="showSignup()">Create Account</button>
<div id="signupBox" style="display:none;">

<h3>Create Account</h3>

<input type="text" id="newUser" placeholder="Enter Name">
<input type="password" id="newPass" placeholder="Enter Password">

<button onclick="signup()">Create</button>

<p id="signupMsg"></p>

</div>

<p id="msg"></p>

</div>
